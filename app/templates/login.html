{% extends "base.html" %}
{% block title %}Login — Fitrack{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Welcome back</h2>
        <p class="subtitle">Log in to track your nutrition and gym session</p>
        <form method="POST">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary-custom" style="margin-top:1rem;">Log In</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{{ url_for('auth.signup') }}">Create one</a></p>
    </div>
</div>
{% endblock %}
