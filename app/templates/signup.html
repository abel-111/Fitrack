{% extends "base.html" %}
{% block title %}Sign Up — Fitrack{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Join Fitrack</h2>
        <p class="subtitle">Personalized AI nutrition & progressive tracking</p>
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>I am joining as a:</label>
                <div style="display:flex; gap:10px; margin-top:4px;">
                    <label style="flex:1; display:flex; align-items:center; gap:8px; background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); padding:10px 14px; border-radius:var(--radius-sm); cursor:pointer;">
                        <input type="radio" name="account_type" value="client" checked onchange="toggleAccountType(this.value)" style="accent-color:var(--brand-primary);">
                        <span style="font-weight:600; font-size:13.5px;">🏃 Member / Client</span>
                    </label>
                    <label style="flex:1; display:flex; align-items:center; gap:8px; background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); padding:10px 14px; border-radius:var(--radius-sm); cursor:pointer;">
                        <input type="radio" name="account_type" value="coach" onchange="toggleAccountType(this.value)" style="accent-color:var(--brand-primary);">
                        <span style="font-weight:600; font-size:13.5px;">🌿 Fitness Coach</span>
                    </label>
                </div>
            </div>

            <!-- Client specific field -->
            <div class="form-group" id="clientRoleField">
                <label>Your Primary Role / Lifestyle</label>
                <select name="role" class="form-control">
                    {% if roles %}
                        {% for r_key, r_data in roles.items() %}
                            <option value="{{ r_key }}" {% if r_key == 'desk_worker' %}selected{% endif %}>
                                {{ r_data.icon }} {{ r_data.title }}
                            </option>
                        {% endfor %}
                    {% else %}
                        <option value="desk_worker">💼 Desk Worker / Corporate</option>
                        <option value="student">🎓 Student</option>
                        <option value="athlete">🏃 Athlete</option>
                        <option value="bodybuilder">🏋️ Bodybuilder</option>
                        <option value="busy_parent">👨‍👩‍👧 Busy Parent / Pro</option>
                        <option value="general">🧘 General Fitness</option>
                    {% endif %}
                </select>
                <small style="color:var(--text-muted); font-size:11.5px; display:block; margin-top:4px;">
                    Calibrates your AI coach, daily meal plans, and posture warm-ups.
                </small>
            </div>

            <!-- Coach specific fields -->
            <div id="coachExtraFields" style="display:none;">
                <div class="form-group">
                    <label>Coaching Specialty / Expertise</label>
                    <input type="text" name="coach_specialty" class="form-control" placeholder="e.g. Strength & Conditioning, Fat Loss, South Indian Nutrition">
                </div>
                <div class="form-group">
                    <label>Short Coach Bio &amp; Credentials</label>
                    <input type="text" name="coach_bio" class="form-control" placeholder="e.g. Certified CSCS & Sports Nutritionist with 8+ years coaching experience">
                </div>
            </div>

            <button type="submit" class="btn-primary-custom" style="margin-top:1rem;">Create Account</button>
        </form>

        <script>
            function toggleAccountType(type) {
                const clientRole = document.getElementById('clientRoleField');
                const coachExtra = document.getElementById('coachExtraFields');
                if (type === 'coach') {
                    clientRole.style.display = 'none';
                    coachExtra.style.display = 'block';
                } else {
                    clientRole.style.display = 'block';
                    coachExtra.style.display = 'none';
                }
            }
        </script>
        <p class="auth-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
