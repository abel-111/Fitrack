<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gym Community{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="navbar-custom">
        <a class="navbar-brand" href="{{ url_for('auth.index') }}">🏋 Gym Community</a>
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('auth.logout') }}" style="color:#9a9a9a; font-size:13px; text-decoration:none;">Logout</a>
        {% endif %}
    </div>

    <div style="padding: 1rem 2rem;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert-box alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    {% block content %}{% endblock %}
</body>
</html>
